name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze  --no-fatal-warnings
        
      - name: Pruebas
        run: flutter test